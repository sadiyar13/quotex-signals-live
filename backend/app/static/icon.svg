<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="#1E293B" stroke-width="4"/>

  <!-- Candlesticks Symbol -->
  <!-- Red Candle Left -->
  <line x1="140" y1="170" x2="140" y2="350" stroke="#EF4444" stroke-width="8" stroke-linecap="round"/>
  <rect x="120" y="210" width="40" height="90" rx="6" fill="#EF4444"/>

  <!-- Green Candle Center -->
  <line x1="256" y1="120" x2="256" y2="400" stroke="#10B981" stroke-width="10" stroke-linecap="round"/>
  <rect x="232" y="160" width="48" height="180" rx="8" fill="url(#greenGlow)"/>

  <!-- Lightning Bolt -->
  <path d="M 330 140 L 280 260 L 340 260 L 300 380 L 380 240 L 330 240 Z" fill="#FBBF24" filter="drop-shadow(0 0 16px rgba(251, 191, 36, 0.6))"/>

  <!-- Pulse Dot -->
  <circle cx="256" cy="120" r="12" fill="#38BDF8"/>
</svg>
